# GoReleaser v2 configuration.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  # darwin excluded: cockroachdb-parser pulls gosigar which needs cgo on darwin.
  # macOS users: use the Docker image (linux/arm64 runs natively on Apple Silicon).
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.serverVersion={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows gets a .zip instead of a tarball.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

# Multi-arch Docker image published to Google Artifact Registry. WIF auth
# and docker login happen in the release workflow before GoReleaser runs.
dockers_v2:
  - id: cockroachdb-mcp-server
    images:
      - us-docker.pkg.dev/releases-prod/cockroachdb-mcp-server/cockroachdb-mcp-server
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
    labels:
      org.opencontainers.image.title: cockroachdb-mcp-server
      org.opencontainers.image.description: Self-hosted MCP server for CockroachDB.
      org.opencontainers.image.source: https://github.com/cockroachdb/cockroachdb-mcp-server
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

